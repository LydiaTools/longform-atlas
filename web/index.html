<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="local-token" content="__LOCAL_TOKEN__"><title>Global Longform SEO Studio · Longform Atlas</title><link rel="stylesheet" href="./style.css"></head>
<body><div class="app">
  <header><div class="brand"><span class="symbol" aria-hidden="true">✦</span><div><strong>Longform Atlas</strong><small id="brand-caption"></small></div></div><div class="header-right"><span id="local-badge"></span><button id="language" type="button">中文</button></div></header>
  <div class="workspace">
    <aside><div class="aside-top"><span id="workspace-label"></span><span class="rail-number">01 / 04</span></div><ol><li class="current" id="nav-ip"></li><li id="nav-brief"></li><li id="nav-sources"></li><li id="nav-draft"></li></ol><p id="aside-help"></p><a href="https://github.com/LydiaTools/longform-atlas" target="_blank" rel="noreferrer">GitHub</a></aside>
    <main>
      <div class="intro"><div class="intro-top"><span id="intro-kicker"></span><span id="edition">v0.2</span></div><h1 id="hero"></h1><p id="hero-copy"></p><p id="demo-note" hidden></p><button id="sample" class="quiet" type="button"></button></div>
      <section class="sheet ip-sheet" aria-labelledby="ip-heading"><div class="section-title"><span class="num">01</span><div><h2 id="ip-heading"></h2><p id="ip-help"></p></div></div>
        <div class="grid"><div class="field"><label for="ip-name" id="ip-name-label"></label><input id="ip-name" maxlength="120" autocomplete="off"></div><div class="field"><label for="ip-type" id="ip-type-label"></label><select id="ip-type"><option value="practitioner"></option><option value="tool-builder"></option><option value="research-curator"></option><option value="buyer-guide"></option></select></div></div>
        <div class="field"><label for="ip-audience" id="ip-audience-label"></label><input id="ip-audience" maxlength="250"></div>
        <div class="field"><label for="ip-keywords" id="ip-keywords-label"></label><textarea id="ip-keywords" rows="2" maxlength="1000"></textarea></div>
        <div class="field"><label for="ip-proof" id="ip-proof-label"></label><textarea id="ip-proof" rows="2" maxlength="2000"></textarea></div>
        <div class="grid"><div class="field"><label for="ip-positioning" id="ip-positioning-label"></label><textarea id="ip-positioning" rows="3" maxlength="1200"></textarea></div><div class="field"><label for="ip-voice" id="ip-voice-label"></label><select id="ip-voice"><option value="practical"></option><option value="analytical"></option><option value="warm"></option></select></div></div>
        <fieldset class="targets"><legend id="targets-label"></legend><label><input type="checkbox" name="target" value="x" checked> X Articles</label><label><input type="checkbox" name="target" value="quora" checked> Quora Answers</label><label><input type="checkbox" name="target" value="medium" checked> Medium</label><label><input type="checkbox" name="target" value="linkedin"> LinkedIn Articles</label><label><input type="checkbox" name="target" value="substack"> Substack</label></fieldset>
        <div class="controls"><button id="suggest-ip" class="secondary" type="button"></button><button id="build-plan" class="primary" type="button"></button></div><p id="ip-status" role="status" aria-live="polite"></p>
        <div class="ip-preview"><span id="ip-preview-label"></span><p id="ip-preview-text"></p></div>
        <div id="plan-results" aria-live="polite"></div><div class="controls plan-actions"><button id="batch-generate" class="primary" type="button"></button><button id="export-batch" class="secondary" type="button"></button></div><p id="batch-status" role="status" aria-live="polite"></p>
      </section>
      <section class="sheet" aria-labelledby="brief-heading"><div class="section-title"><span class="num">02</span><div><h2 id="brief-heading"></h2><p id="brief-help"></p></div></div>
        <div class="field"><label for="topic" id="topic-label"></label><input id="topic" maxlength="250" autocomplete="off"></div>
        <div class="grid"><div class="field"><label for="audience" id="audience-label"></label><input id="audience" maxlength="250"></div><div class="field"><label for="platform" id="platform-label"></label><select id="platform"><option value="x">X Articles</option><option value="quora">Quora Answers</option><option value="medium">Medium</option><option value="linkedin">LinkedIn Articles</option><option value="substack">Substack</option></select><p id="platform-guide" class="field-help"></p></div></div>
        <div class="field"><label for="angle" id="angle-label"></label><textarea id="angle" rows="3" maxlength="1000"></textarea></div>
        <div class="field"><label for="evidence" id="evidence-label"></label><textarea id="evidence" rows="4" maxlength="8000"></textarea></div>
        <div class="grid"><div class="field"><label for="query" id="query-label"></label><input id="query" maxlength="120"></div><div class="field"><label for="intent" id="intent-label"></label><select id="intent"><option value="informational">Informational / 信息型</option><option value="comparison">Comparison / 比较型</option><option value="howto">How-to / 教程型</option></select></div></div>
        <div class="field"><label for="canonical" id="canonical-label"></label><input id="canonical" type="url" placeholder="https://your-site.example/original-article"></div>
      </section>
      <section class="sheet" aria-labelledby="sources-heading"><div class="section-title"><span class="num">03</span><div><h2 id="sources-heading"></h2><p id="sources-help"></p></div></div>
        <div id="sources"></div><button id="add-source" class="quiet" type="button"></button>
      </section>
      <section class="sheet" aria-labelledby="draft-heading"><div class="section-title"><span class="num">04</span><div><h2 id="draft-heading"></h2><p id="draft-help"></p></div></div>
        <div class="grid"><div class="field"><label for="output-language" id="output-language-label"></label><select id="output-language"><option value="en">English</option><option value="zh">中文</option></select></div><div class="field"><label for="words" id="words-label"></label><input id="words" type="number" min="500" max="2500" value="1200"></div></div>
        <div class="provider"><div class="provider-heading"><h3 id="provider-title"></h3><p id="provider-help"></p></div><div class="field"><label for="base-url" id="base-label"></label><input id="base-url" type="url" placeholder="https://api.example.com/v1" autocomplete="off"></div><div class="grid"><div class="field"><label for="model" id="model-label"></label><input id="model" autocomplete="off"></div><div class="field"><label for="api-key" id="key-label"></label><input id="api-key" type="password" autocomplete="off"></div></div></div>
        <div class="controls"><button id="outline" class="secondary" type="button"></button><button id="generate" class="primary" type="button"></button></div><p id="status" role="status" aria-live="polite"></p>
        <div class="output-head"><label for="draft" id="draft-label"></label><span id="draft-state"></span></div><textarea id="draft" rows="24" spellcheck="true"></textarea><div class="controls"><button id="copy" class="secondary" type="button"></button><button id="download" class="secondary" type="button"></button><button id="audit-button" class="secondary" type="button"></button></div><div id="audit" role="status" aria-live="polite"></div><p class="end-note" id="review-note"></p>
      </section>
    </main>
  </div><footer><span id="footer-left"></span><span>LydiaTools · MIT</span></footer>
</div><script src="./app.js"></script></body></html>
